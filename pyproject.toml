[project]
name = "heron"
version = "0.4.0"
description = "Modelling platform for heterogeneous robotic systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core installs without vendor dependencies (ARCHITECTURE.md, section 10).
# Anything that pulls in a simulator, a robot SDK or a training framework
# belongs to an optional group below, never here.
dependencies = [
    # Version conditions of environment requirements are PEP 440 (ADR-0025).
    "packaging>=23",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
sim = ["mujoco>=3.1"]
onnx = ["onnxruntime>=1.18"]
# A run on disk (ADR-0038). Not vendor code, and still optional: the core runs without it.
record = ["mcap>=1.1"]
# What ROS 2's Python messages import and a venv does not get from ROS 2 itself; ROS 2 comes
# from apt. Held together with ros2.names.ADAPTER_PYTHON_PACKAGES by a test.
ros2 = ["numpy"]
dev = [
    "mcap>=1.1",
    # Tests build tiny policies with onnx and run them with onnxruntime (ADR-0047).
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
]

[project.scripts]
# The command name repeats the package name: renaming touches this file by
# design (section 17, step 2 of the rename procedure).
heron = "heron.cli.main:app"

# Built-in plugins are registered through the same entry points third-party
# packages use. The core has no private path for its own adapters.
[project.entry-points."heron.adapters"]
dummy = "heron.adapters.dummy:DummyAdapter"
ros2_control = "heron.adapters.ros2_control:Ros2ControlAdapter"

# The training environment is derived from a contract and knows no robot, so it
# ships with the core exactly as the simulation backends do (ADR-0044). Isaac,
# torch and the learning library are imported in the training process alone.
[project.entry-points."heron.train_backends"]
isaaclab = "heron.train.isaaclab:IsaacLabBackend"

[project.entry-points."heron.sim_backends"]
gazebo = "heron.sim.gazebo:GazeboBackend"
# Shared by every robot with a MuJoCo twin, and knowing none of them (ADR-0030).
mujoco = "heron.sim.mujoco:MujocoBackend"

# The other side of a link in simulation (ADR-0021). The ros2_control path in
# Gazebo is a twin like any vendor's, registered the same way.
[project.entry-points."heron.twins"]
ros2_control_gazebo = "heron.generators.ros2_control:Ros2ControlTwin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heron"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# RUF001/RUF002 guard against homoglyphs sneaking into ASCII text. Here messages
# addressed to a human are Russian by project rule (CLAUDE.md), so the rule fires
# on every one of them and reports nothing real.
ignore = ["RUF001", "RUF002"]

[tool.ruff.lint.isort]
known-first-party = ["heron"]

[tool.mypy]
python_version = "3.11"
packages = ["heron"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true

# Imported only when a record is opened (ADR-0038). Its installed sources are seen by mypy
# under two module names and stop the check, so it is not followed.
[[tool.mypy.overrides]]
module = ["mcap", "mcap.*"]
follow_imports = "skip"
ignore_missing_imports = true

# A policy is run through onnxruntime, imported when an artifact is loaded (ADR-0047); tests
# build networks with onnx. Neither ships type information.
[[tool.mypy.overrides]]
module = ["onnx", "onnx.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# The training process runs inside a simulator that is not installed here and
# cannot be a dependency of the core (ADR-0044). Its imports are unresolvable on
# the machine the platform is developed on, and the objects it builds are the
# framework's, so this one module is checked for syntax and names rather than
# for types. What it reads -- the derivation, the refusals, the artifact -- is
# ordinary code and is checked in full.
[[tool.mypy.overrides]]
module = [
    "isaacsim", "isaacsim.*", "isaaclab", "isaaclab.*", "isaaclab_rl", "isaaclab_rl.*",
    "rsl_rl", "rsl_rl.*", "torch", "torch.*", "gymnasium", "gymnasium.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["heron.train.isaaclab_process"]
disallow_untyped_defs = false
disallow_any_unimported = false
disallow_subclassing_any = false
warn_return_any = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
