# Сцена обучения: закреплённый G1 учится приводить верх тела в заданную позу.
#
# Вторая реализация конвейера фазы 6 (ADR-0040), задача ADR-0005 п. 1 — в той мере, в какой её
# держит мир платформы: баланс вместо встроенного контроллера держит крепление таза в описании
# (ADR-P6A). Владелец физики — бэкенд обучения (ADR-0002), адаптера ученику не нужно (ADR-0044).
#
# Среда не настраивается здесь: частоты, действие, наблюдение, привод и закрепление базы
# выводятся из профиля и его описания. Что именно выведено, печатает
#   heron train run examples/scenarios/g1_mounted_train.yaml --registry examples/robots --dry-run
#
# Задача ставится пакетом examples/plugins/g1_upper_reach и находится по имени в группе точек
# входа задач. Ядро о ней не знает.
schema_version: 1
name: g1_mounted_train

world:
  backend: isaaclab

robots:
  - {id: g1, profile: g1_29dof_lock_waist_rev_1_0_mounted, role: learner, task: g1_upper_reach}
