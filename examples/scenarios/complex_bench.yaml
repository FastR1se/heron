# Фаза 8: состав комплекса complex.yaml — G1 и манипулятор — в мире из чисел.
#
# Та же миссия examples/missions/complex.yaml, что идёт в Gazebo, проверяется и выполняется здесь
# без симулятора: миссия не знает, в каком мире работает (ADR-0065), а координатор раздаёт задачи
# по возможностям профилей, которые у роботов те же (ADR-0066). Меняется сцена, не миссия.
#
# Описание G1 — вход производителя: python examples/robots/g1_23dof/fetch_description.py.
#
# Время мира dummy идёт на период состояния за чтение, а исполнитель — на частоте команд. У G1 это
# 500 и 50 Гц: секунда мира — десять секунд стены, поэтому прогон этой сцены долгий.
schema_version: 1
name: complex_bench

world:
  backend: dummy

robots:
  - {id: g1, profile: g1_23dof, pose: [0.0, 0.0, 0.8], role: scripted}
  - {id: arm1, profile: arm6, pose: [2.5, 0.0, 0.0], role: scripted}
