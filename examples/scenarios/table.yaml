# Сцена фазы 2: манипулятор из профиля стоит в мире и виден в визуализации.
#
# Владелец физики один — gazebo (ADR-0002); все участники обязаны иметь адаптер
# sim.gazebo, иначе валидатор остановит сцену до запуска.
#
# Роботов два, и оба из одного профиля. Это не удвоение ради числа: пара
# одинаковых роботов показывает, что всё именуемое строится от идентификатора в
# сценарии, а не от имени профиля — пространства имён, префиксы систем отсчёта,
# каталоги порождённых артефактов. Второй объявлен препятствием, и потому
# контроллеров не получает вовсе.
#
# Поле world.file не задано, поэтому мир порождается. Задали бы — он стал бы
# входом, как описание кинематики, и генератор бы его не трогал (ADR-0009).
schema_version: 1
name: table

world:
  backend: gazebo

robots:
  - {id: arm1, profile: arm6, pose: [0.0, 0.0, 0.0], role: scripted}
  - {id: arm2, profile: arm6, pose: [0.9, 0.0, 0.0], role: static}
