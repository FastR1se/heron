# Сцена исполнения: закреплённый G1 в Gazebo, верх тела к позе (фаза 6, этап 7).
#
# Робот — тот, на котором обучалась политика g1_upper_reach: таз привинчен к стойке на 1.0 м
# описанием, а не платформой (ADR-0063, ADR-0048). Поэтому поза в сценарии — нули: стойка стоит
# на полу в начале координат, высоту задаёт описание, и задаёт её один раз.
#
# Связь — DDS производителя: адаптер тот же, что ведёт двойника MuJoCo и железо, а по ту сторону —
# мост пакета G1 в менеджере контроллеров (ADR-0033). Мост ведёт 15 суставов верха тела; ноги
# без момента висят на креплении (ADR-0064). Руки до первой команды тоже без момента и висят в
# нулевой позе — из неё навык и начинает.
#
# Цель — в радианах и в порядке contract.joint_order: пояс в нуле, плечи вперёд и в стороны,
# локти согнуты, запястья в нуле. Руки — как в humanoid.yaml. Цель одна у навыка кодом и у
# обученного: обученный её поля duration не читает (ADR-0043), а замена навыка — одна строка
# профиля (ADR-0046).
schema_version: 1
name: g1_mounted

world:
  backend: gazebo

robots:
  - {id: g1, profile: g1_29dof_lock_waist_rev_1_0_mounted, pose: [0.0, 0.0, 0.0], role: scripted}

task:
  skill: move_joints
  target: [0.0,
           -0.5, 0.3, 0.0, 0.8, 0.0, 0.0, 0.0,
           -0.5, -0.3, 0.0, 0.8, 0.0, 0.0, 0.0]
  duration: 4.0
