# Сцена обучения: манипулятор arm6 учится приводить суставы в заданную позу.
#
# Владелец физики — бэкенд обучения (ADR-0002): адаптера тут никто не требует,
# потому что ученика ведёт не адаптер, а алгоритм (ADR-0044). Участник один:
# сосед в среде обучения — отложенная задача, а не забытая.
#
# Среда не настраивается здесь и нигде: частоты, действие, наблюдение и привод
# выводятся из контракта профиля. Что именно выведено, печатает
#   heron train run examples/scenarios/arm6_train.yaml --dry-run
#
# Задача ставится пакетом examples/plugins/arm6_reach и находится по этому имени
# в группе точек входа задач. Ядро о ней не знает.
schema_version: 1
name: arm6_train

world:
  backend: isaaclab

robots:
  - {id: arm1, profile: arm6, role: learner, task: arm6_reach}
