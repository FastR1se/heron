# Сцена обучения: G1 на свободной базе учится стоять (ADR-0075).
#
# Держит робота только политика: описание производителя без звена world, база свободна
# (ADR-0048). Корпус политика чувствует через IMU таза — угловая скорость и направление
# тяжести (ADR-0076). Владелец физики — бэкенд обучения (ADR-0002), адаптера ученику не нужно
# (ADR-0044).
#
# Высота появления — pose ниже: таз на 0.8 м, стопы чуть над полом, робот встаёт на них в
# первые шаги (ADR-0077). Сбросы эпизода смещают вокруг этой точки.
#
# Среда не настраивается здесь: частоты, действие, наблюдение, привод выводятся из профиля.
# Что именно выведено, печатает
#   heron train run examples/scenarios/g1_stand_train.yaml --registry examples/robots --dry-run
#
# Задача ставится пакетом examples/plugins/g1_stand и находится по имени в группе точек входа
# задач. Ядро о ней не знает.
schema_version: 1
name: g1_stand_train

world:
  backend: isaaclab

robots:
  - {id: g1, profile: g1_29dof_lock_waist_rev_1_0, pose: [0.0, 0.0, 0.8], role: learner,
     task: g1_stand}
