[project]
name = "arm6-reach"
version = "0.1.0"
description = "Training task for the example arm: reach a joint pose"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The platform is a dependency like any other, and what this package takes from it
# is its public API and nothing else (ADR-0021, ADR-0044); a test in the platform
# reads the imports to hold it to that.
#
# Isaac Lab is deliberately not listed. It is not installable from an index the way
# a library is, it lives in the training environment, and the backend declares it as
# an environment requirement the platform checks before a run (ADR-0025).
dependencies = ["heron>=0.5"]

# The sixth extension point. The name is what a scenario's learner writes in its
# `task` field, and the name the artifact is stored under.
[project.entry-points."heron.train_tasks"]
arm6_reach = "arm6_reach.task:Arm6ReachTask"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm6_reach"]
