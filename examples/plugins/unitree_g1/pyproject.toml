[project]
name = "unitree-g1"
version = "0.1.0"
description = "Unitree G1 for the platform: a DDS adapter for every environment, and its twins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The platform is a dependency like any other. What this package takes from it is
# its public API and nothing else (ADR-0021), and a test in the platform reads the
# imports to hold it to that.
#
# CycloneDDS and the vendor's SDK are deliberately not listed: CycloneDDS 0.10.2
# has no wheels for Python 3.11+ and is built from source against its own C
# library (ADR-0022). The adapter declares them as environment requirements
# instead, which the platform checks before connecting (ADR-0025).
dependencies = ["heron>=0.3"]

# How the platform finds this package: the same group its built-in adapters use.
[project.entry-points."heron.adapters"]
unitree_g1_dds = "unitree_g1.adapter:G1DdsAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitree_g1"]
