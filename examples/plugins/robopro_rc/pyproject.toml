[project]
name = "robopro-rc"
version = "0.1.0"
description = "Robopro RC-series arms for the platform: an adapter of the command class over the vendor's API"
readme = "README.md"
# The platform needs 3.11; the vendor's API 1.4.1 declares <3.14 (fact 0.3).
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

# From the platform this package imports its public API and nothing else (ADR-0021).
# The vendor's API is not listed: it is a zip archive, not a package on an index, and
# its licence does not let it be vendored. The adapter declares it as an environment
# requirement, checked before connecting (ADR-0025).
dependencies = ["heron"]

[project.optional-dependencies]
# The platform's contract suite, run from this package's tests (ADR-0056).
test = ["heron[testing]"]

# How the platform finds the adapter: the group its built-in adapters use.
[project.entry-points."heron.adapters"]
robopro_rc = "robopro_rc.adapter:RoboproRcAdapter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robopro_rc"]
