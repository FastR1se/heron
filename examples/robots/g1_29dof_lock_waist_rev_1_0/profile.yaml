# G1 с закреплённой талией: 29 приводов по раскладке, из них подвижны 27 — у талии
# только рыскание, запястья полные. Такой робот сообщает mode_machine = 6; таблица
# описаний производителя (README g1_description в unitree_ros) называет для этого
# значения описание g1_29dof_lock_waist_rev_1_0 — по нему профиль и назван (ADR-0059).
# Тип машины виден и в приложении производителя: Device → Data → Robot → Machine Type.
#
# Описание кинематики — вход от производителя (ADR-0009). Загружается скриптом:
#
#     python examples/robots/g1_29dof_lock_waist_rev_1_0/fetch_description.py
#
# Второго описания (MJCF) и мира MuJoCo нет: двойник производителя загружает сцену на
# 23 или 29 степеней свободы и сообщает 4 или 5 — тело из 27 суставов связь с ним
# отвергла бы при connect (ADR-0027). Здесь работают dummy, Gazebo и железо.
#
# База свободна, встроенный контроллер отключён (low): равновесие не держит никто.
# Условие прогона — urdf.free_base_uncontrolled (ADR-0018).
schema_version: 1
name: g1_29dof_lock_waist_rev_1_0

description:
  urdf: vendor/unitree_ros/robots/g1_description/g1_29dof_lock_waist_rev_1_0.urdf

contract:
  revision: 2
  joint_order:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - left_wrist_pitch_joint
    - left_wrist_yaw_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
    - right_wrist_pitch_joint
    - right_wrist_yaw_joint
  angle_unit: rad
  state_rate_hz: 500
  command_rate_hz: 50
  # Стойка (ADR-0075): колени чуть согнуты — бедро −0.1, колено 0.3, голеностоп −0.2; руки —
  # как у закреплённого профиля. Поза отсчёта наблюдения и действия, она же цель навыка g1_stand.
  default_pose: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0,
                 -0.1, 0.0, 0.0, 0.3, -0.2, 0.0,
                 0.0,
                 -0.2, 0.2, 0.0, 0.6, 0.0,
                 0.0, 0.0,
                 -0.2, -0.2, 0.0, 0.6, 0.0,
                 0.0, 0.0]
  # Корпус — как робот его измеряет, IMU таза (ADR-0076): угловая скорость и направление тяжести.
  observation:
    - {type: base_ang_vel, scale: 0.25}
    - {type: projected_gravity, scale: 1.0}
    - {type: joint_pos_rel, scale: 1.0}
    - {type: joint_vel, scale: 0.05}
    - {type: target_joint_pos, scale: 1.0}
    - {type: previous_action, scale: 1.0}
  # Цель политики — clip(a) · 0.25 + default_pose (ADR-0041): ±0.25 рад вокруг стойки. Самая
  # узкая рамка — крен голеностопа ±0.2618; колено 0.3 − 0.25 = 0.05 выше −0.0873.
  #
  # Закон tau = kp·(q* − q) − kd·dq на state_rate_hz в обоих мирах (ADR-0045). Ротора нет, поэтому
  # устойчивость — по инерциям описания (ADR-0063, п. 5): b = kd·dt/I_min < 2 и kp·dt < 2·kd.
  # Ноги — порядок unitree_rl_gym (бедро 100, колено 150, голеностоп 40) там, где критерий
  # позволяет; крен голеностопа (I_min 3.9e-4) — kd 0.2, крен запястья (3.7e-4) — kd 0.18.
  # Проверка: python scripts/tools/gains-check.py <этот профиль>.
  action:
    type: joint_position
    clip: [-1.0, 1.0]
    scale: [0.25, 0.25, 0.25, 0.25, 0.25, 0.25,
            0.25, 0.25, 0.25, 0.25, 0.25, 0.25,
            0.25,
            0.25, 0.25, 0.25, 0.25, 0.25,
            0.25, 0.25,
            0.25, 0.25, 0.25, 0.25, 0.25,
            0.25, 0.25]
    offset: default_pose
    kp: [100, 100, 100, 150, 40, 40,
         100, 100, 100, 150, 40, 40,
         150,
         40, 40, 20, 40, 10,
         10, 10,
         40, 40, 20, 40, 10,
         10, 10]
    kd: [2, 2, 2, 4, 1, 0.2,
         2, 2, 2, 4, 1, 0.2,
         3,
         2, 3, 1, 2, 0.18,
         0.4, 0.4,
         2, 3, 1, 2, 0.18,
         0.4, 0.4]

capabilities: [arm.joint_position]
control_mode: streaming
access_levels: [low]

limits:
  joint_position:
    min: [-2.5307, -0.5236, -2.7576, -0.087267, -0.87267, -0.2618,
          -2.5307, -2.9671, -2.7576, -0.087267, -0.87267, -0.2618,
          -2.618,
          -3.0892, -1.5882, -2.618, -1.0472, -1.972222054,
          -1.61443, -1.61443,
          -3.0892, -2.2515, -2.618, -1.0472, -1.972222054,
          -1.61443, -1.61443]
    max: [2.8798, 2.9671, 2.7576, 2.8798, 0.5236, 0.2618,
          2.8798, 0.5236, 2.7576, 2.8798, 0.5236, 0.2618,
          2.618,
          2.6704, 2.2515, 2.618, 2.0944, 1.972222054,
          1.61443, 1.61443,
          2.6704, 1.5882, 2.618, 2.0944, 1.972222054,
          1.61443, 1.61443]
  joint_velocity:
    max: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0,
          3.0, 3.0, 3.0, 3.0, 3.0, 3.0,
          3.0,
          3.0, 3.0, 3.0, 3.0, 3.0,
          3.0, 3.0,
          3.0, 3.0, 3.0, 3.0, 3.0,
          3.0, 3.0]

adapters:
  sim.dummy:
    plugin: dummy
  sim.gazebo:
    plugin: unitree_g1_dds
    params: {domain: 1, interface: lo, peers: [127.0.0.1]}
  real:
    plugin: unitree_g1_dds
    params: {domain: 0, interface: wlp2s0}

skills: [hold, move_joints]