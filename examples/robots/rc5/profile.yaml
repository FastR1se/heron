# «Робопро» RC5 — коллаборативный манипулятор, командный класс интерфейса (фаза 5).
# Контроллер принимает точку движения и сообщает о завершении: навык — goto_joints,
# потоковые hold и move_joints на этом профиле валидатор отвергает (ADR-0049).
#
# Адаптер — пакет examples/plugins/robopro_rc поверх API производителя 1.4.1.
# Описание — rc5.urdf, написано руками по таблице DH API; соглашение DH — предположение,
# проверяется на пробе до первого движения (ADR-0055).
#
# Мир робота — dummy в командном режиме: у производителя нет симулятора, и миссия
# проверяется в мире из чисел, прежде чем уйти на железо целью real (ADR-0051):
#   run examples/scenarios/rc5_bench.yaml --registry examples/robots --target real --speed-scale 0.1
schema_version: 1
name: rc5

description:
  urdf: rc5.urdf

contract:
  revision: 1
  joint_order: [joint1, joint2, joint3, joint4, joint5, joint6]
  angle_unit: deg          # как у API и паспорта; на провод адаптер отдаёт радианы
  # Как часто контроллер публикует RTD, не названо нигде; поле cycle_time пакета без
  # единицы. 10 Гц — объявление снизу: робот, публикующий чаще, сторожевой таймер не
  # обманывает (ADR-0050), порог — 1 с. Проба 0.31 и 0.47 даёт настоящее, и контракт
  # получает revision 2.
  state_rate_hz: 10
  command_rate_hz: 2       # навык решает дважды в секунду; движение ведёт контроллер
  observation:
    - {type: joint_pos, scale: 1.0}
  action:
    type: joint_position   # цель движения, а не уставка

capabilities: [arm.joint_position]
control_mode: command
access_levels: []

# Рамка — выбор стенда, не паспорт. Паспорт (факт 0.18): оси 1, 2, 4, 5, 6 — ±360°,
# ось 3 — ±165°, все 180 °/с. Здесь один оборот вместо двух и 160° у оси 3.
# Скорость и ускорение — умолчания движения по суставам самого API 1.4.1
# (MOTION_SETUP: 60 °/с, 80 °/с²); контроллер умножает их на шкалу прогона s и s²
# (ADR-0052, ADR-0057). API берёт одну скорость и одно ускорение на точку — адаптер
# отдаёт наименьшие по суставам.
limits:
  joint_position:
    min: [-180.0, -180.0, -160.0, -180.0, -180.0, -180.0]
    max: [180.0, 180.0, 160.0, 180.0, 180.0, 180.0]
  joint_velocity:
    max: [60.0, 60.0, 60.0, 60.0, 60.0, 60.0]        # °/с
  joint_acceleration:
    max: [80.0, 80.0, 80.0, 80.0, 80.0, 80.0]        # °/с²

adapters:
  sim.dummy:
    plugin: dummy
  real:
    plugin: robopro_rc
    params:
      # Статический адрес контроллера по руководству ввода (факт 0.19); на стенде — свой.
      host: 192.168.10.10
      # Модель ровно так, как её называет get_robot_info (ADR-0054). До пробы 0.22 не
      # известна, и здесь её нет намеренно: адаптер отказывает в connect, называя, где
      # взять значение. Не угадывать по семейству (rc5b2 и т. п.) — сравнение на равенство.
      model: null

skills: [goto_joints]
