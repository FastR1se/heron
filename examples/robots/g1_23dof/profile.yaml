# Опорный пример фазы 4: гуманоид, 23 степени свободы, низкоуровневый доступ.
#
# Описание кинематики — вход от производителя (ADR-0009). В репозитории его нет:
# хранится источник и коммит, а файл загружается скриптом рядом с профилем:
#
#     python examples/robots/g1_23dof/fetch_description.py
#
# Имя — модификация, а не семейство: у производителя два десятка описаний G1
# (23 и 29 степеней свободы, с кистями и без), и первое же сравнение с описанием
# дало urdf.name_differs. Предупреждение было право.
#
# База свободна, а встроенный контроллер отключён (low): равновесие не держит
# никто. В нулевой позе на ровных стопах робот стоит статически, но это свойство
# позы, а не управления, и первое движение может его уронить.
# Это условие прогона, объявленное валидатором (urdf.free_base_uncontrolled), а не
# недосмотр — закреплять базу платформа не берётся (ADR-0018).
#
# Ядро об этом роботе не знает ничего: профиль — данные (инвариант 5), а слова
# «гуманоид» нет нигде, кроме этого комментария (инвариант 7).
schema_version: 1
name: g1_23dof

description:
  urdf: vendor/unitree_ros/robots/g1_description/g1_23dof.urdf

contract:
  revision: 1
  # Порядок — порядок двигателей 23-степенной версии в DDS производителя:
  # ноги 0-11, пояс 12, руки 13-22. Он же порядок суставов в описании.
  joint_order:
    - left_hip_pitch_joint
    - left_hip_roll_joint
    - left_hip_yaw_joint
    - left_knee_joint
    - left_ankle_pitch_joint
    - left_ankle_roll_joint
    - right_hip_pitch_joint
    - right_hip_roll_joint
    - right_hip_yaw_joint
    - right_knee_joint
    - right_ankle_pitch_joint
    - right_ankle_roll_joint
    - waist_yaw_joint
    - left_shoulder_pitch_joint
    - left_shoulder_roll_joint
    - left_shoulder_yaw_joint
    - left_elbow_joint
    - left_wrist_roll_joint
    - right_shoulder_pitch_joint
    - right_shoulder_roll_joint
    - right_shoulder_yaw_joint
    - right_elbow_joint
    - right_wrist_roll_joint
  angle_unit: rad
  state_rate_hz: 500
  command_rate_hz: 50
  observation:
    - {type: joint_pos, scale: 1.0}
    - {type: joint_vel, scale: 0.05}
  action:
    type: joint_position

capabilities: [arm.joint_position]
control_mode: streaming
# Встроенный контроллер баланса выключен: командуются все 23 сустава.
access_levels: [low]

limits:
  # Позиции — пределы описания, не шире. Скорости намеренно сужены на порядок
  # против описания (20-37 рад/с): первый запуск — медленный (раздел 12).
  joint_position:
    min: [-2.5307, -0.5236, -2.7576, -0.087267, -0.87267, -0.2618,
          -2.5307, -2.9671, -2.7576, -0.087267, -0.87267, -0.2618,
          -2.618,
          -3.0892, -1.5882, -2.618, -1.0472, -1.972222054,
          -3.0892, -2.2515, -2.618, -1.0472, -1.972222054]
    max: [2.8798, 2.9671, 2.7576, 2.8798, 0.5236, 0.2618,
          2.8798, 0.5236, 2.7576, 2.8798, 0.5236, 0.2618,
          2.618,
          2.6704, 2.2515, 2.618, 2.0944, 1.972222054,
          2.6704, 1.5882, 2.618, 2.0944, 1.972222054]
  joint_velocity:
    max: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0,
          3.0, 3.0, 3.0, 3.0, 3.0, 3.0,
          3.0,
          3.0, 3.0, 3.0, 3.0, 3.0,
          3.0, 3.0, 3.0, 3.0, 3.0]

adapters:
  sim.dummy:
    plugin: dummy
  sim.gazebo:
    plugin: ros2_control

skills: [hold, move_joints]
