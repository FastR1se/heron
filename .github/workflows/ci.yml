# CI гоняет всё, кроме Isaac и железа (ARCHITECTURE.md, раздел 13).
# Симуляторы здесь не запускаются: цепочка проверяется на dummy-адаптере,
# и это не упрощение для CI, а то же самое, что делает человек локально.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Платформа Linux, разработка на Windows: важно, чтобы сообщения на русском
  # не ломали вывод раннера.
  PYTHONIOENCODING: utf-8

jobs:
  checks:
    name: Тесты, типы, линтер
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Фаза 4: пакет робота ставится рядом с платформой, как пакет производителя
      # (ADR-0021). Общий набор адаптеров его находит и отказывается пройти, если
      # пакет лежит в examples/plugins, но не установлен.
      - name: Поставить ядро с dev-зависимостями и пакет робота
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]" -e examples/plugins/unitree_g1

      # Фаза 4: описание G1 — вход производителя, в репозитории лежат только
      # источник и коммит (ADR-0017). Без загрузки тесты на настоящем файле
      # пропускаются; здесь они обязаны выполниться.
      - name: Загрузить описание вендорского робота
        run: uv run python examples/robots/g1_23dof/fetch_description.py

      - name: Линтер
        run: uv run ruff check src tests examples/plugins

      - name: Типы
        run: |
          uv run mypy
          uv run mypy examples/plugins/unitree_g1/src

      - name: Тесты
        run: uv run pytest -v

      # Тесты пакета — на записывающем канале, без CycloneDDS и SDK (ADR-0029).
      - name: Тесты пакета робота
        run: uv run pytest -v examples/plugins/unitree_g1/tests

  core-without-robots:
    name: Инвариант 1 — ядро без роботов
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Проверка из CLAUDE.md выполняется, а не декларируется: удаляем профили
      # роботов целиком и убеждаемся, что ядро собирается и проходит тесты.
      - name: Удалить примеры роботов
        run: rm -rf examples

      - name: Поставить ядро
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Тесты ядра
        run: uv run pytest

  core-without-vendors:
    name: Ядро ставится без вендорских зависимостей
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Раздел 10: ядро ставится без симуляторов, SDK и фреймворков обучения.
      # Ставим без единой дополнительной группы и проверяем, что CLI работает.
      - name: Поставить только ядро
        run: |
          uv venv --python 3.11
          uv pip install -e .

      - name: CLI отвечает
        run: |
          uv run heron version
          uv run heron capabilities
          uv run heron validate examples/robots/arm6.yaml examples/robots/rest_arm.yaml
          uv run heron validate examples/scenarios/bench.yaml --registry examples/robots
          uv run heron validate examples/scenarios/table.yaml --registry examples/robots

      # ADR-0025: проверка окружения — про машину, а не про данные. Сцене на
      # заглушке не нужно ничего; сцене в Gazebo здесь не хватает ROS 2, и
      # команда обязана это назвать, а не пройти.
      - name: Окружение проверяется и называет недостающее
        run: |
          uv run heron env check examples/scenarios/bench.yaml --registry examples/robots
          if uv run heron env check examples/scenarios/table.yaml --registry examples/robots > env-table.txt; then
            echo "env check прошёл на машине без ROS 2"; cat env-table.txt; exit 1
          fi
          grep -F "[env.missing]" env-table.txt
          grep -F "controller_manager" env-table.txt

      # Фаза 2: генераторы не требуют ни симулятора, ни ROS 2 — значит,
      # порождение сред проверяется тем же прогоном, что и установка ядра.
      - name: Среды порождаются и повторно порождаются одинаково
        run: |
          uv run heron gen examples/scenarios/table.yaml --into generated/table --registry examples/robots
          uv run heron gen examples/scenarios/table.yaml --into generated/table --check --registry examples/robots

      - name: Команда запуска сцены строится
        run: |
          uv run heron sim run examples/scenarios/table.yaml --into generated/table --registry examples/robots --dry-run

      # Фаза 4: вендорский робот проходит тот же путь без правок ядра.
      - name: Вендорский робот проверяется и порождает среды
        run: |
          uv run python examples/robots/g1_23dof/fetch_description.py
          uv run heron validate examples/robots/g1_23dof/profile.yaml
          uv run heron gen examples/robots/g1_23dof/profile.yaml --into generated/g1_23dof --backend gazebo
          uv run heron gen examples/robots/g1_23dof/profile.yaml --into generated/g1_23dof --backend gazebo --check
          uv run heron validate examples/scenarios/humanoid.yaml --registry examples/robots
          uv run heron sim run examples/scenarios/humanoid.yaml --into generated/humanoid --registry examples/robots --dry-run
          uv run heron run examples/scenarios/humanoid.yaml --registry examples/robots --dry-run
