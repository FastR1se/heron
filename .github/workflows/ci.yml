# CI гоняет всё, кроме Isaac и железа (ARCHITECTURE.md, раздел 13).
# Симуляторы здесь не запускаются: цепочка проверяется на dummy-адаптере,
# и это не упрощение для CI, а то же самое, что делает человек локально.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Платформа Linux, разработка на Windows: важно, чтобы сообщения на русском
  # не ломали вывод раннера.
  PYTHONIOENCODING: utf-8

jobs:
  checks:
    name: Тесты, типы, линтер
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Фаза 4: пакет робота ставится рядом с платформой, как пакет производителя
      # (ADR-0021). Общий набор адаптеров пакет прогоняет из своих тестов (ADR-0056).
      # Фаза 5: пакет RC — тем же путём; SDK производителя здесь нет и не нужен.
      - name: Поставить ядро с dev-зависимостями и пакеты роботов
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]" -e examples/plugins/unitree_g1 -e examples/plugins/robopro_rc

      # Фаза 4: описание G1 — вход производителя, в репозитории лежат только
      # источник и коммит (ADR-0017). Без загрузки тесты на настоящем файле
      # пропускаются; здесь они обязаны выполниться.
      - name: Загрузить описание вендорского робота
        run: uv run python examples/robots/g1_23dof/fetch_description.py

      - name: Линтер
        run: uv run ruff check src tests examples/plugins

      - name: Типы
        run: |
          uv run mypy
          uv run mypy examples/plugins/unitree_g1/src
          uv run mypy examples/plugins/robopro_rc/src

      - name: Тесты
        run: uv run pytest -v

      # Тесты пакета — на записывающем канале, без CycloneDDS и SDK (ADR-0029).
      - name: Тесты пакета робота
        run: uv run pytest -v examples/plugins/unitree_g1/tests

      # Фаза 5: адаптер RC на записывающем канале и на заменителе SDK (ADR-0053, ADR-0062).
      - name: Тесты пакета RC
        run: uv run pytest -v examples/plugins/robopro_rc/tests

  core-without-robots:
    name: Инвариант 1 — ядро без роботов
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Установить uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Проверка из CLAUDE.md выполняется, а не декларируется: удаляем профили
      # роботов целиком и убеждаемся, что ядро собирается и проходит тесты.
      - name: Удалить примеры роботов
        run: rm -rf examples

      - name: Поставить ядро
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Тесты ядра
        run: uv run pytest

  core-without-vendors:
    name: Ядро ставится без вендорских зависимостей
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Раздел 10: ядро ставится без симуляторов, SDK и фреймворков обучения.
      # Ставим без единой дополнительной группы и проверяем, что CLI работает.
      - name: Поставить только ядро
        run: |
          uv venv --python 3.11
          uv pip install -e .

      - name: CLI отвечает
        run: |
          uv run heron version
          uv run heron capabilities
          uv run heron validate examples/robots/arm6.yaml examples/robots/rest_arm.yaml
          uv run heron validate examples/scenarios/bench.yaml --registry examples/robots
          uv run heron validate examples/scenarios/table.yaml --registry examples/robots

      # Фаза 5: командный класс исполняется на мире из чисел, а та же миссия уходит на
      # железо целью; без шкалы скорости прогон на железе не планируется (ADR-0051, ADR-0052).
      - name: Командный класс на dummy и план прогона на железе
        run: |
          uv run heron run examples/scenarios/rest_bench.yaml --registry examples/robots
          uv run heron validate examples/robots/rc5/profile.yaml
          uv run heron run examples/scenarios/rc5_bench.yaml --registry examples/robots
          uv run heron run examples/scenarios/rc5_bench.yaml --registry examples/robots \
            --target real --speed-scale 0.1 --dry-run
          # Критерий 3 фазы 5: потоковый навык на настоящем профиле — отказ до подключения.
          if uv run heron skill check move_joints examples/robots/rc5/profile.yaml; then
            echo "потоковый навык принят на командном RC5"; exit 1
          fi
          uv run heron run examples/scenarios/rest_bench.yaml --registry examples/robots \
            --target real --speed-scale 0.1 --dry-run
          if uv run heron run examples/scenarios/rest_bench.yaml --registry examples/robots \
               --target real --dry-run; then
            echo "прогон на железе спланирован без шкалы скорости"; exit 1
          fi

      # Фаза 8: миссия двух роботов разных классов связи. Координатор раздаёт задачи по
      # возможностям и сам запускает процесс каждого робота (ADR-0065 – ADR-0069).
      - name: Миссия комплекса на dummy
        run: |
          uv run heron mission validate examples/scenarios/mixed_bench.yaml \
            examples/missions/mixed_bench.yaml --registry examples/robots
          uv run heron mission run examples/scenarios/mixed_bench.yaml \
            examples/missions/mixed_bench.yaml --registry examples/robots --into generated/mission
          grep -F '"status": "success"' generated/mission/result.json

      # ADR-0025: проверка окружения — про машину, а не про данные. Сцене на
      # заглушке не нужно ничего; сцене в Gazebo здесь не хватает ROS 2, и
      # команда обязана это назвать, а не пройти.
      - name: Окружение проверяется и называет недостающее
        run: |
          uv run heron env check examples/scenarios/bench.yaml --registry examples/robots
          if uv run heron env check examples/scenarios/table.yaml --registry examples/robots > env-table.txt; then
            echo "env check прошёл на машине без ROS 2"; cat env-table.txt; exit 1
          fi
          grep -F "[env.missing]" env-table.txt
          grep -F "controller_manager" env-table.txt

      # Фаза 2: генераторы не требуют ни симулятора, ни ROS 2 — значит,
      # порождение сред проверяется тем же прогоном, что и установка ядра.
      - name: Среды порождаются и повторно порождаются одинаково
        run: |
          uv run heron gen examples/scenarios/table.yaml --into generated/table --registry examples/robots
          uv run heron gen examples/scenarios/table.yaml --into generated/table --check --registry examples/robots

      - name: Команда запуска сцены строится
        run: |
          uv run heron sim run examples/scenarios/table.yaml --into generated/table --registry examples/robots --dry-run

      # Фаза 4: вендорский робот проходит тот же путь без правок ядра.
      - name: Вендорский робот проверяется и порождает среды
        run: |
          uv run python examples/robots/g1_23dof/fetch_description.py
          uv run heron validate examples/robots/g1_23dof/profile.yaml
          uv run heron gen examples/robots/g1_23dof/profile.yaml --into generated/g1_23dof --backend gazebo
          uv run heron gen examples/robots/g1_23dof/profile.yaml --into generated/g1_23dof --backend gazebo --check
          uv run heron validate examples/scenarios/humanoid.yaml --registry examples/robots
          uv run heron sim run examples/scenarios/humanoid.yaml --into generated/humanoid --registry examples/robots --dry-run
          uv run heron run examples/scenarios/humanoid.yaml --registry examples/robots --dry-run

      # Фаза 4, этап 7: комплекс. Без пакета G1 сцена проверяется, а окружение мира на этой
      # машине не выводится — план манипулятора обязан это назвать, а не промолчать (ADR-0039).
      - name: Сцена комплекса проверяется
        run: |
          uv run heron validate examples/scenarios/complex.yaml --registry examples/robots
          uv run heron run examples/scenarios/complex.yaml --registry examples/robots --robot arm1 \
            --skill move_joints -g "target=[0,-0.6,1.2,0,0.9,0]" -g duration=4 --dry-run > run-complex.txt
          cat run-complex.txt
          grep -F "окружение не выводится" run-complex.txt
          # Фаза 8: та же миссия комплекса — в Gazebo и в мире из чисел (ADR-0065, ADR-0066).
          uv run heron mission validate examples/scenarios/complex.yaml \
            examples/missions/complex.yaml --registry examples/robots
          uv run heron mission validate examples/scenarios/complex_bench.yaml \
            examples/missions/complex.yaml --registry examples/robots
          uv run heron mission run examples/scenarios/complex.yaml examples/missions/complex.yaml \
            --registry examples/robots --into generated/mission-complex --no-spawn --dry-run

      # Фаза 4, этап 4: мир MuJoCo — двойник производителя (ADR-0030). Без пакета робота
      # сцена проверяется (MJCF, сцена, шаг), а мир не строится — двойника некому поставить.
      - name: Сцена с двойником MuJoCo проверяется
        run: |
          uv run heron validate examples/scenarios/humanoid_mujoco.yaml --registry examples/robots
          uv run heron run examples/scenarios/humanoid_mujoco.yaml --registry examples/robots --dry-run
          if uv run heron sim run examples/scenarios/humanoid_mujoco.yaml --into generated/mujoco --registry examples/robots --dry-run > sim-mujoco.txt 2>&1; then
            echo "мир MuJoCo построен без пакета робота"; cat sim-mujoco.txt; exit 1
          fi
          grep -F "адаптер не установлен" sim-mujoco.txt

  user-robot-stub:
    name: Критерий 10 — заготовка робота пользователя
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ADR-0056: путь пользователя проверяется тем путём, что у пользователя. Заготовка
      # командного класса ставится пакетом рядом с платформой, её профиль проходит validate,
      # а общий набор из тестов заготовки падает — и только на TODO, которые она оставила.
      - name: Заготовка ставится, проверяется и называет свои TODO
        run: |
          uv venv --python 3.11
          uv pip install -e ".[testing]"
          .venv/bin/heron profile new my_robot --into "$RUNNER_TEMP" --control-mode command
          uv pip install -e "$RUNNER_TEMP/my_robot[test]"
          .venv/bin/heron validate "$RUNNER_TEMP/my_robot/profile.yaml"
          cd "$RUNNER_TEMP/my_robot"
          if "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest -q tests > suite.txt 2>&1; then
            echo "набор заготовки прошёл, хотя адаптер — одни TODO"; cat suite.txt; exit 1
          fi
          cat suite.txt
          if grep -E "^E  " suite.txt | grep -v "TODO"; then
            echo "набор заготовки упал не на TODO"; exit 1
          fi
